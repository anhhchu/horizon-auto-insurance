<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 1252" width="1580" height="1252" role="img" aria-labelledby="title desc">
  <title id="title">Runtime interaction</title>
  <desc id="desc">Sequence of an underwriter review: the app reads the queue, policy evidence, and decision history from Lakebase, asks the Genie Agent in Agent mode as the user (governed SQL on the warehouse, and the guidelines volume when needed, with citations), and records the underwriter approval or override in Lakebase.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=DM+Mono:wght@400;500&amp;display=swap');
    /* Databricks brand tokens (databricks-impeccable brand-tokens.css) */
    svg {
      --db-lava-600: #FF3621;
      --db-navy-900: #0B2026;
      --db-oat-medium: #EEEDE9;
      --db-oat-light: #F9F7F4;
      --db-white: #FFFFFF;
      --db-neutral-700: #4A5568;
      --db-border: #C4CCD6;
      --db-font-primary: 'DM Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --db-font-mono: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }
    .canvas { fill: var(--db-oat-light); }
    text { font-family: var(--db-font-primary); fill: var(--db-navy-900); }
    .h-title { font-size: 32px; font-weight: 700; letter-spacing: -0.01em; }
    .h-sub { font-size: 18px; fill: var(--db-neutral-700); }
    .eyebrow { font-size: 15px; font-weight: 500; fill: var(--db-neutral-700); }
    .region { fill: var(--db-oat-medium); }
    .region-line { fill: none; stroke: var(--db-border); stroke-width: 1; }
    .node { fill: var(--db-white); stroke: var(--db-border); stroke-width: 1; }
    .node-hero { fill: var(--db-navy-900); }
    .t { font-size: 17px; font-weight: 700; }
    .tm { font-family: var(--db-font-mono); font-size: 15px; font-weight: 500; }
    .s { font-size: 14px; fill: var(--db-neutral-700); }
    .on-dark { fill: var(--db-white); }
    .on-dark-muted { fill: var(--db-oat-medium); font-size: 14px; }
    .pill { fill: var(--db-lava-600); }
    .pill-text { font-size: 13px; font-weight: 700; fill: var(--db-white); }
    .actor { fill: var(--db-white); stroke: var(--db-navy-900); stroke-width: 1.5; }
    .edge { fill: none; stroke: var(--db-neutral-700); stroke-width: 1.5; }
    .edge-label { font-size: 14px; fill: var(--db-neutral-700); }
    .arrowhead { fill: var(--db-neutral-700); }
      .lifeline { stroke: var(--db-border); stroke-width: 1.5; stroke-dasharray: 4 6; }
    .band { fill: var(--db-oat-medium); }
    .step { fill: var(--db-navy-900); }
    .step-human { fill: var(--db-lava-600); }
    .step-text { font-size: 13px; font-weight: 700; fill: var(--db-white); }
    .msg { font-size: 15px; }
    .edge-reply { fill: none; stroke: var(--db-neutral-700); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .opt { fill: none; stroke: var(--db-neutral-700); stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <rect class="canvas" width="1580" height="1252"/>
  <text class="h-title" x="40" y="68">Runtime interaction</text>
  <text class="h-sub" x="40" y="100">Genie answers from governed data and the guidelines, as the user. Only the underwriter writes a decision.</text>
  <rect class="band" x="24" y="236" width="1532" height="282" rx="8"/>
  <text class="eyebrow" x="40" y="258">Review</text>
  <rect class="band" x="24" y="546" width="1532" height="400" rx="8"/>
  <text class="eyebrow" x="40" y="568">Investigate</text>
  <rect class="band" x="24" y="974" width="1532" height="190" rx="8"/>
  <text class="eyebrow" x="40" y="996">Decide</text>
  <rect class="opt" x="850" y="732" width="660" height="112" rx="6"/>
  <text class="s" x="1494" y="832" text-anchor="end">When the question needs the guidelines</text>
  <line class="lifeline" x1="175" y1="206" x2="175" y2="1202"/>
  <rect class="actor" x="105" y="150" width="140" height="44" rx="22"/>
  <text class="t" x="175" y="178" text-anchor="middle">Underwriter</text>
  <line class="lifeline" x1="425" y1="206" x2="425" y2="1202"/>
  <rect class="node" x="330" y="150" width="190" height="56" rx="8"/>
  <text class="t" x="425" y="184" text-anchor="middle">Horizon App</text>
  <line class="lifeline" x1="675" y1="206" x2="675" y2="1202"/>
  <rect class="node" x="580" y="150" width="190" height="56" rx="8"/>
  <text class="t" x="675" y="184" text-anchor="middle">Lakebase</text>
  <line class="lifeline" x1="925" y1="206" x2="925" y2="1202"/>
  <rect class="node" x="830" y="150" width="190" height="56" rx="8"/>
  <text class="t" x="925" y="184" text-anchor="middle">Genie Agent</text>
  <line class="lifeline" x1="1175" y1="206" x2="1175" y2="1202"/>
  <rect class="node" x="1080" y="150" width="190" height="56" rx="8"/>
  <text class="t" x="1175" y="184" text-anchor="middle">SQL warehouse</text>
  <line class="lifeline" x1="1425" y1="206" x2="1425" y2="1202"/>
  <rect class="node" x="1330" y="150" width="190" height="56" rx="8"/>
  <text class="t" x="1425" y="184" text-anchor="middle">Guidelines volume</text>
  <path class="edge" d="M175 270 H422" marker-end="url(#arrow)"/>
  <circle class="step" cx="195" cy="256" r="11"/>
  <text class="step-text" x="195" y="260.5" text-anchor="middle">1</text>
  <text class="msg" x="213" y="261">Open review queue</text>
  <path class="edge" d="M425 316 H672" marker-end="url(#arrow)"/>
  <circle class="step" cx="445" cy="302" r="11"/>
  <text class="step-text" x="445" y="306.5" text-anchor="middle">2</text>
  <text class="msg" x="463" y="307">Queue and KPIs</text>
  <path class="edge-reply" d="M675 362 H428" marker-end="url(#arrow)"/>
  <circle class="step" cx="445" cy="348" r="11"/>
  <text class="step-text" x="445" y="352.5" text-anchor="middle">3</text>
  <text class="msg" x="463" y="353">West rows + decision status</text>
  <path class="edge" d="M175 408 H422" marker-end="url(#arrow)"/>
  <circle class="step" cx="195" cy="394" r="11"/>
  <text class="step-text" x="195" y="398.5" text-anchor="middle">4</text>
  <text class="msg" x="213" y="399">Open policy</text>
  <path class="edge" d="M425 454 H672" marker-end="url(#arrow)"/>
  <circle class="step" cx="445" cy="440" r="11"/>
  <text class="step-text" x="445" y="444.5" text-anchor="middle">5</text>
  <text class="msg" x="463" y="445">Policy + history</text>
  <path class="edge-reply" d="M675 500 H428" marker-end="url(#arrow)"/>
  <circle class="step" cx="445" cy="486" r="11"/>
  <text class="step-text" x="445" y="490.5" text-anchor="middle">6</text>
  <text class="msg" x="463" y="491">Evidence · band · action</text>
  <path class="edge" d="M175 580 H422" marker-end="url(#arrow)"/>
  <circle class="step" cx="195" cy="566" r="11"/>
  <text class="step-text" x="195" y="570.5" text-anchor="middle">7</text>
  <text class="msg" x="213" y="571">Ask Genie</text>
  <path class="edge" d="M425 626 H922" marker-end="url(#arrow)"/>
  <circle class="step" cx="445" cy="612" r="11"/>
  <text class="step-text" x="445" y="616.5" text-anchor="middle">8</text>
  <text class="msg" x="463" y="617">Question with policy ID, as the user</text>
  <path class="edge" d="M925 672 H1172" marker-end="url(#arrow)"/>
  <circle class="step" cx="945" cy="658" r="11"/>
  <text class="step-text" x="945" y="662.5" text-anchor="middle">9</text>
  <text class="msg" x="963" y="663">Governed SQL</text>
  <path class="edge-reply" d="M1175 718 H928" marker-end="url(#arrow)"/>
  <circle class="step" cx="945" cy="704" r="11"/>
  <text class="step-text" x="945" y="708.5" text-anchor="middle">10</text>
  <text class="msg" x="963" y="709">Rows</text>
  <path class="edge" d="M925 764 H1422" marker-end="url(#arrow)"/>
  <circle class="step" cx="945" cy="750" r="11"/>
  <text class="step-text" x="945" y="754.5" text-anchor="middle">11</text>
  <text class="msg" x="963" y="755">Search guidelines</text>
  <path class="edge-reply" d="M1425 810 H928" marker-end="url(#arrow)"/>
  <circle class="step" cx="945" cy="796" r="11"/>
  <text class="step-text" x="945" y="800.5" text-anchor="middle">12</text>
  <text class="msg" x="963" y="801">Cited passages</text>
  <path class="edge-reply" d="M925 882 H428" marker-end="url(#arrow)"/>
  <circle class="step" cx="445" cy="868" r="11"/>
  <text class="step-text" x="445" y="872.5" text-anchor="middle">13</text>
  <text class="msg" x="463" y="873">Answer + SQL + citations, streamed</text>
  <path class="edge" d="M425 928 H672" marker-end="url(#arrow)"/>
  <circle class="step" cx="445" cy="914" r="11"/>
  <text class="step-text" x="445" y="918.5" text-anchor="middle">14</text>
  <text class="msg" x="463" y="919">Audit event</text>
  <path class="edge" d="M175 1008 H422" marker-end="url(#arrow)"/>
  <circle class="step-human" cx="195" cy="994" r="11"/>
  <text class="step-text" x="195" y="998.5" text-anchor="middle">15</text>
  <text class="msg" x="213" y="999">Approve or override</text>
  <path class="edge" d="M425 1054 H672" marker-end="url(#arrow)"/>
  <circle class="step" cx="445" cy="1040" r="11"/>
  <text class="step-text" x="445" y="1044.5" text-anchor="middle">16</text>
  <text class="msg" x="463" y="1045">Decision + audit event</text>
  <path class="edge-reply" d="M675 1100 H428" marker-end="url(#arrow)"/>
  <circle class="step" cx="445" cy="1086" r="11"/>
  <text class="step-text" x="445" y="1090.5" text-anchor="middle">17</text>
  <text class="msg" x="463" y="1091">Recorded decision</text>
  <path class="edge-reply" d="M425 1146 H178" marker-end="url(#arrow)"/>
  <circle class="step" cx="195" cy="1132" r="11"/>
  <text class="step-text" x="195" y="1136.5" text-anchor="middle">18</text>
  <text class="msg" x="213" y="1137">Next open policy</text>
  <text class="s" x="40" y="1232">Solid: request · dashed: response. Step 15 is the underwriter decision; the app records it in step 16. Genie never writes decisions.</text>
</svg>
