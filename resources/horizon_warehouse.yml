resources:
  sql_warehouses:
    # Dedicated warehouse for Horizon SQL tasks and the Genie Agent. App pages read Lakebase,
    # so this warehouse only serves jobs and governed analytics.
    horizon_warehouse:
      name: horizon-auto-warehouse
      cluster_size: X-Small
      warehouse_type: PRO
      enable_serverless_compute: true
      auto_stop_mins: 10
      min_num_clusters: 1
      max_num_clusters: 2
      tags:
        custom_tags:
          - key: project
            value: horizon-auto
